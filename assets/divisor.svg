<svg xmlns="http://www.w3.org/2000/svg" width="960" height="4" viewBox="0 0 960 4" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0072a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00a3b4"/>
      <stop offset="1" stop-color="#0072a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1" width="960" height="2" rx="1" fill="url(#g)" opacity="0.8"/>
  <rect y="1" width="160" height="2" rx="1" fill="url(#s)">
    <animate attributeName="x" from="-160" to="960" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
