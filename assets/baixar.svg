<svg xmlns="http://www.w3.org/2000/svg" width="340" height="58" viewBox="0 0 340 58" role="img" aria-label="Baixar a versão mais recente">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0072a8"/>
      <stop offset="1" stop-color="#00a3b4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="340" height="58" rx="29"/></clipPath>
  </defs>
  <rect width="340" height="58" rx="29" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <rect y="0" width="90" height="58" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-140;380;380" keyTimes="0;0.45;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="339" height="57" rx="28.5" fill="none" stroke="#fff" stroke-opacity="0.18"/>
  <text x="170" y="35" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.4" fill="#fff">Baixar a versão mais recente</text>
</svg>
